{% extends "base/entry-card-page.html" %}

{% block title %}Register on Ianus{% endblock %}

{% block card_title %}
<h2 class="mdl-card__title-text">Ianus</h2>
{% endblock %}

{% block card_content %}
<p>Create account or <a href="/entrypoint/login">log in</a> to continue</p>
<form id="login-form">
    <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label" style="width:100%">
        <input class="mdl-textfield__input" type="text" id="username" name="username" required>
        <label class="mdl-textfield__label" for="username">Username</label>
    </div>
    <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label" style="width:100%">
        <input class="mdl-textfield__input" type="password" id="password" name="password" required>
        <label class="mdl-textfield__label" for="password">Password</label>
    </div>
    <div id="error-container" class="error-message" style="display:none"></div>
</form>
{% endblock %}

{% block card_actions %}
<button type="submit" form="login-form" class="mdl-button mdl-button--primary mdl-js-button mdl-js-ripple-effect" id="login-btn">
    Register
</button>
{% endblock %}

{% block extend_scripts %}
<script>
    const form = document.getElementById('login-form');
    const btn = document.getElementById('login-btn');
    const errorContainer = document.getElementById('error-container');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      btn.disabled = true;
      btn.textContent = 'Registering...';
      errorContainer.style.display = 'none';

      try {
        const response = await fetch('http://localhost:8080/api/v1/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password }),
          credentials: 'include',
        });

        const data = await response.json();

        if (response.ok) {
          window.location.href = '/my';
        } else {
          errorContainer.textContent = data.message || 'Registration failed';
          errorContainer.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Register';
        }
      } catch (err) {
        errorContainer.textContent = 'Network error. Please try again.';
        errorContainer.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Register';
      }
    });
</script>
{% endblock %}
