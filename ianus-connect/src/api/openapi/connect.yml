openapi: 3.0.2
info:
  title: Ianus Connect API
  description: Ianus public OIDC interface
  version: 1.0.0
servers:
  - url: https://id.tapeline.dev/connect
tags:
  - name: OAuth 2.0
    description: OAuth 2.0 compliant endpoints
    externalDocs:
      description: as per RFC6749
      url: https://www.rfc-editor.org/info/rfc6749/#section-3.1.1
  - name: OpenID Connect 1.0
    description: OpenID Connect 1.0 compliant endpoints
    externalDocs:
      description: as per OIDC Core Errata 2
      url: https://openid.net/specs/openid-connect-core-1_0.html
  - name: Authorise & consent
    description: Various Ianus-specific user consent and app authorisation endpoints


paths:
  /api/v1/oauth2/authorize:
    get:
      summary: OAuth2.0 compliant Authorization Endpoint
      description: |
        Obtain an OAuth2.0 grant.
        
        Note: does not support implicit flow, as it's considered unsafe.
      tags: [OAuth 2.0]
      parameters:
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum: [code, id_token]
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
        - name: scope
          in: query
          required: false
          schema:
            type: string
          description: Space-separated list of scopes (must include `openid` for OIDC)
        - name: state
          in: query
          required: false
          schema:
            type: string
          description: Opaque value used to maintain state between the request and the callback (CSRF protection)
        - name: nonce
          in: query
          required: false
          schema:
            type: string
          description: String value used to associate a Client session with an ID Token
      responses:
        '302':
          description: |
            Redirects to the consent screen with an authorization intention or error.
            
            Query params to redirection:
            - `intent` - JWT/JWE packed with everything about the authorisation about to be performed
            - `appName` - name of the app that tries to authorise the action, for frontend usage
            - `scopes` - scopes about to be granted, for frontend usage
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '401':
          description: Not authorised
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      summary: OAuth2.0 compliant Authorization Endpoint
      description: |
        Obtain an OAuth2.0 grant.
        
        Note: does not support implicit flow, as it's considered unsafe.
      tags: [OAuth 2.0]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OAuthAuthorizeRequest"
      responses:
        '302':
          description: |
            Redirects to the consent screen with an authorization intention or error.
            
            Query params to redirection:
            - `intent` - JWT/JWE packed with everything about the authorisation about to be performed
            - `appName` - name of the app that tries to authorise the action, for frontend usage
            - `scopes` - scopes about to be granted, for frontend usage
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '401':
          description: Not authorised
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/oauth2/token:
    post:
      summary: OAuth2.0 compliant Token Endpoint
      description: Exchange an authorization code or refresh token for access, ID, and refresh tokens.
      tags: [ OAuth 2.0 ]
      security:
        - relyingPartyAuth: [ ]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OAuthTokenRequest"
      responses:
        '200':
          description: Successful token exchange.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            Pragma:
              schema:
                type: string
                example: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthTokenResponse"
        '400':
          description: Invalid grant, code, or request structure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '401':
          description: Client authentication failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'

  /api/v1/oauth2/userinfo:
    get:
      summary: OpenID Connect 1.0 UserInfo Endpoint
      description: Returns identity claims about the authenticated user based on the granted access token scopes.
      tags: [ OpenID Connect 1.0 ]
      security:
        - grantedAccessTokenAuth: [ ]
      responses:
        '200':
          description: User claims profile data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthUserInfoResponse"
        '401':
          description: Invalid or expired access token.

  /api/v1/oauth2/jwks:
    get:
      summary: JSON Web Key Set Endpoint
      description: Public keys used to cryptographically verify signatures of ID tokens and access tokens issued by Ianus.
      tags: [ OpenID Connect 1.0 ]
      responses:
        '200':
          description: A collection of public cryptographic keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Jwks"

  /.well-known/openid-configuration:
    get:
      summary: OpenID Connect Discovery Metadata
      description: Public configuration document used by standard OIDC clients to auto-discover provider properties.
      tags: [ OpenID Connect 1.0 ]
      responses:
        '200':
          description: OIDC Provider metadata properties.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidConfig"

  /api/v1/connect/authorize:
    post:
      summary: Perform authorisation by intent
      tags: [ Authorise & consent ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthoriseRequest"
      responses:
        '302':
          description: Granted access, redirects to RP's `redirect_uri`
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '401':
          description: Not authorised
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: SESSIONID
      description: Regular user's browser authentication.
    relyingPartyAuth:
      type: http
      scheme: basic
      description: Client ID and Client Secret authentication.
    grantedAccessTokenAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Granted access token authentication.
  schemas:
    AuthoriseRequest:
      type: object
      nullable: false
      required:
        - intent
      properties:
        intent:
          type: string
          minLength: 1
          description: The RP's intent about to be authorised
          nullable: false

    OAuthTokenResponse:
      type: object
      nullable: false
      required:
        - access_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          description: The access token used to call protected APIs.
          nullable: false
        token_type:
          type: string
          example: Bearer
          nullable: false
        expires_in:
          type: integer
          nullable: false
          description: Lifetime of the access token in seconds.
        refresh_token:
          type: string
          nullable: false
          description: Optional token used to acquire new access tokens.
        id_token:
          type: string
          nullable: false
          description: A signed JSON Web Token (JWT) containing user identity assertions (returned if `openid` scope was requested).
        scope:
          type: string
          description: The scopes approved for this access token.
          nullable: false

    OAuthTokenRequest:
      type: object
      nullable: false
      required:
        - grant_type
      properties:
        grant_type:
          type: string
          enum: [ "authorization_code", "refresh_token", "urn:ietf:params:oauth:grant-type:device_code" ]
          description: The method used to request the token.
          nullable: false
        code:
          type: string
          description: Required if grant_type is `authorization_code`. The code received from the `/authorize` endpoint.
          nullable: false
        redirect_uri:
          type: string
          format: uri
          description: Required if grant_type is `authorization_code`. Must exactly match the redirect_uri sent to `/authorize`.
          nullable: false
        refresh_token:
          type: string
          description: Required if grant_type is `refresh_token`. The token used to obtain a renewed access token.
          nullable: false
        client_id:
          type: string
          description: Required only if the client cannot use HTTP Basic Auth for credentials.
          nullable: false
        client_secret:
          type: string
          description: Required only if using form-based client authentication.
          nullable: false


    OAuthUserInfoResponse:
      type: object
      required:
        - sub
      properties:
        sub:
          type: string
          description: Unique subject identifier for the end-user.
        name:
          type: string
        given_name:
          type: string
        family_name:
          type: string
        email:
          type: string
          format: email
        email_verified:
          type: boolean
    OAuthAuthorizeRequest:
      type: object
      nullable: false
      required:
        - response_type
        - client_id
        - redirect_uri
      properties:
        response_type:
          type: string
          enum: [ code, id_token ]
          nullable: false
        client_id:
          type: string
          nullable: false
          minLength: 1
        redirect_uri:
          type: string
          format: uri
          nullable: false
          minLength: 1
        scope:
          type: string
          nullable: false
          description: Space-separated list of scopes (must include `openid` for OIDC).
        state:
          type: string
          nullable: false
          description: Opaque value used to maintain state
        nonce:
          type: string
          nullable: false
          description: String value used to associate a Client session with an ID Token
    Jwks:
      type: object
      required:
        - keys
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/Jwk"
    Jwk:
      type: object
      required:
        - kty
        - kid
        - use
        - alg
      properties:
        kty:
          type: string
          description: Key Type (e.g., RSA or EC).
        kid:
          type: string
          description: Unique Key ID matching the header entry of your JWTs.
        use:
          type: string
          example: sig
        alg:
          type: string
          example: RS256
        n:
          type: string
          description: RSA public key modulus (if kty is RSA).
        e:
          type: string
          description: RSA public key exponent (if kty is RSA).
    OAuthError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_client
            - invalid_grant
            - unauthorized_client
            - unsupported_grant_type
            - invalid_scope
        error_description:
          type: string
          description: Human-readable error description explaining the diagnostic root.
    ErrorResponse:
      type: object
      required:
        - error_code
        - message
      properties:
        error_code:
          type: string
          description: Machine readable error code
          example: "UNAUTHORISED"
          minLength: 1
          nullable: false
        message:
          type: string
          description: Human readable error description
          example: "Cannot perform this action"
          minLength: 1
          nullable: false
    OidConfig:
      type: object
      required:
        - issuer
        - authorization_endpoint
        - token_endpoint
        - jwks_uri
        - response_types_supported
        - subject_types_supported
        - id_token_signing_alg_values_supported
      properties:
        issuer:
          type: string
          format: uri
        authorization_endpoint:
          type: string
          format: uri
        token_endpoint:
          type: string
          format: uri
        userinfo_endpoint:
          type: string
          format: uri
        jwks_uri:
          type: string
          format: uri
        scopes_supported:
          type: array
          items:
            type: string
        response_types_supported:
          type: array
          items:
            type: string
        subject_types_supported:
          type: array
          items:
            type: string
        id_token_signing_alg_values_supported:
          type: array
          items:
            type: string
