openapi: 3.0.2
info:
  title: Ianus Connect API
  description: Ianus public OIDC interface
  version: 1.0.0
servers:
  - url: https://id.tapeline.dev/connect
tags:
  - name: OAuth 2.0
    description: OAuth 2.0 compliant endpoints
    externalDocs:
      description: as per RFC6749
      url: https://www.rfc-editor.org/info/rfc6749/#section-3.1.1
  - name: OpenID Connect 1.0
    description: OpenID Connect 1.0 compliant endpoints
    externalDocs:
      description: as per OIDC Core Errata 2
      url: https://openid.net/specs/openid-connect-core-1_0.html



paths:
  /api/v1/oauth2/authorize:
    get:
      summary: OAuth2.0 compliant Authorization Endpoint
      description: |
        Obtain an OAuth2.0 grant.
        
        Note: does not support implicit flow, as it's considered unsafe.
      tags: [OAuth 2.0]
      parameters:
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum: [code, id_token]
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
        - name: scope
          in: query
          required: false
          schema:
            type: string
          description: Space-separated list of scopes (must include `openid` for OIDC)
        - name: state
          in: query
          required: false
          schema:
            type: string
          description: Opaque value used to maintain state between the request and the callback (CSRF protection)
        - name: nonce
          in: query
          required: false
          schema:
            type: string
          description: String value used to associate a Client session with an ID Token
      responses:
        '302':
          description: Redirects to the `redirect_uri` with an authorization code or error.
        '400':
          description: Invalid request parameters.

    post:
      summary: OAuth2.0 compliant Authorization Endpoint
      description: |
        Obtain an OAuth2.0 grant.
        
        Note: does not support implicit flow, as it's considered unsafe.
      tags: [OAuth 2.0]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - response_type
                - client_id
                - redirect_uri
              properties:
                response_type:
                  type: string
                  enum: [code, id_token]
                client_id:
                  type: string
                redirect_uri:
                  type: string
                  format: uri
                scope:
                  type: string
                  description: Space-separated list of scopes (must include `openid` for OIDC).
                state:
                  type: string
                  description: Opaque value used to maintain state
                nonce:
                  type: string
                  description: String value used to associate a Client session with an ID Token
      responses:
        '302':
          description: Redirects to the `redirect_uri` with an authorization code or error.
        '400':
          description: Invalid request parameters.
          
          
components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        petId:
          type: integer
          format: int64
          example: 198772
        quantity:
          type: integer
          format: int32
          example: 7
        shipDate:
          type: string
          format: date-time
        status:
          type: string
          description: Order Status
          example: approved
          enum:
            - placed
            - approved
            - delivered
        complete:
          type: boolean
      xml:
        name: order
    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Dogs
      xml:
        name: category
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        username:
          type: string
          example: theUser
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: James
        email:
          type: string
          example: john@email.com
        password:
          type: string
          example: '12345'
        phone:
          type: string
          example: '12345'
        userStatus:
          type: integer
          description: User Status
          format: int32
          example: 1
      xml:
        name: user
    Tag:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      xml:
        name: tag
    Pet:
      required:
        - name
        - photoUrls
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        name:
          type: string
          example: doggie
        category:
          $ref: '#/components/schemas/Category'
        photoUrls:
          type: array
          xml:
            wrapped: true
          items:
            type: string
            xml:
              name: photoUrl
        tags:
          type: array
          xml:
            wrapped: true
          items:
            $ref: '#/components/schemas/Tag'
        status:
          type: string
          description: pet status in the store
          enum:
            - available
            - pending
            - sold
      xml:
        name: pet
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        type:
          type: string
        message:
          type: string
      xml:
        name: '##default'
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
        - code
        - message
  requestBodies:
    Pet:
      description: Pet object that needs to be added to the store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Pet'
        application/xml:
          schema:
            $ref: '#/components/schemas/Pet'
    UserArray:
      description: List of user object
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/User'
  securitySchemes:
    petstore_auth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://petstore3.swagger.io/oauth/authorize
          scopes:
            "write:pets": modify pets in your account
            "read:pets": read your pets
    api_key:
      type: apiKey
      name: api_key
      in: header