spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ianus
    username: dbaas
    password: dbaas
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: true
    change-log: classpath:/migrations/master.yml

app:
  mail:
    backend: smtp
    config:
      host: localhost
      port: 1025
      username: ""
      password: ""
      authenticate: false

  db:
    jdbcUrl: "jdbc:postgresql://localhost:5432/ianus"
    username: dbaas
    password: dbaas
    pool-size: 30

account:
  2fa:
    verificationTtl: 5m
    persistentTtl: 1h
    signingKey: changemechangemechangemechangeme
    encryptionKey: changemechangemechangemechangeme

  sessions:
    minSessionTtl: 10m
    maxSessionTtl: 30d
    defaultSessionTtl: 7d
    sessionIdLengthBytes: 128

  registration:
    minPasswordLength: 8
    enabled: true

issuer:
  issuer: http://localhost:8080

connect:
  apps:
    - id: myapp
      name: Test OIDC client
      #       secret
      secret: $argon2id$v=19$m=60000,t=10,p=1$7ckGMfZ1/EhArzu2CITZ0w$Cz+uPCy1BVPF0WVFhHxSN6U4guTKYkB75Ei+kJKtPU0
      scopes:
        - openid
      redirectUri: https://oidcdebugger.com/debug
    - id: testapp
      name: Test OIDC client 2
      #       secret
      secret: $argon2id$v=19$m=60000,t=10,p=1$7ckGMfZ1/EhArzu2CITZ0w$Cz+uPCy1BVPF0WVFhHxSN6U4guTKYkB75Ei+kJKtPU0
      scopes:
        - openid
      redirectUri: http://localhost:9009
  intent:
    ttl: 5m
    signingKey: changemechangemechangemechangeme
    encryptionKey: changemechangemechangemechangeme
  authorisationCode:
    ttl: 5m
    signingKey: changemechangemechangemechangeme
    encryptionKey: changemechangemechangemechangeme
  token:
    accessTokenLengthBytes: 128
    refreshTokenLengthBytes: 128
    accessTokenTtl: 24h

logging:
